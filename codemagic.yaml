workflows:
  ios-release:
    name: iOS Build & TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        APPLE_TEAM_ID: "N2S5289QDM"
    scripts:
      - name: Install Node Dependencies
        script: |
          npm uninstall @capacitor/app --no-save || true
          npm install --legacy-peer-deps
          npm uninstall @capacitor/app --no-save || true
          rm -rf node_modules/@capacitor/app || true

          # Install macOS arm64 native binaries
          OXIDE_VER=$(node -p "require('./node_modules/@tailwindcss/oxide/package.json').version" 2>/dev/null || echo "4.3.3")
          LIGHTNING_VER=$(node -p "require('./node_modules/lightningcss/package.json').version" 2>/dev/null || node -p "require('@tailwindcss/node/node_modules/lightningcss/package.json').version" 2>/dev/null || echo "1.33.0")
          ROLLDOWN_VER=$(node -p "require('./node_modules/rolldown/package.json').version" 2>/dev/null || echo "1.2.9")
          npm install @tailwindcss/oxide-darwin-arm64@$OXIDE_VER lightningcss-darwin-arm64@$LIGHTNING_VER @rolldown/binding-darwin-arm64@$ROLLDOWN_VER @esbuild/darwin-arm64 @resvg/resvg-js-darwin-arm64 --no-save

          node scripts/patch-capacitor.js || true

      - name: Build Web Application
        script: |
          NODE_ENV=production npx vite build --mode production

      - name: Prepare & Sync iOS Native Project
        script: |
          # Clean old SPM build cache from previous runs
          rm -rf ios/App/CapApp-SPM/.build || true
          npx cap sync ios
          # Inject iOS-only NativePurchases.autoFinishTransactions=false and verify BOTH
          # CapacitorCommunityAdmob & CapgoNativePurchases are registered in SPM + capacitor.config.json
          node scripts/patch-ios-cap-config.js
          mkdir -p ios/App/App/public
          rm -rf ios/App/App/public/*
          cp -r dist/* ios/App/App/public/

      - name: Install Fastlane & Tools
        script: |
          gem install fastlane --no-document
          node scripts/strip-icon-alpha.js || true

      - name: Patch Xcode Project Signing
        script: |
          RUN_NUM="${BUILD_NUMBER:-1}"
          BASE_BUILD=$(( RUN_NUM + 252 ))
          export BUILD_NUMBER=$BASE_BUILD
          echo "BUILD_NUMBER=$BASE_BUILD" >> $CM_ENV
          echo "Initial floor Build Number (Fastlane will auto-increment above App Store Connect latest): $BASE_BUILD"
          python3 scripts/patch-xcode-signing.py ios/App/App.xcodeproj/project.pbxproj "${APPLE_TEAM_ID:-N2S5289QDM}" "" "$BASE_BUILD"

      - name: Build Signed IPA with Fastlane
        script: |
          set -o pipefail
          mkdir -p build/logs

          echo "=== Verifying Credentials Presence (Secrets Redacted) ==="
          echo "APP_STORE_KEY_ID: ${APP_STORE_KEY_ID:-[EMPTY]}"
          echo "APP_STORE_ISSUER_ID: ${APP_STORE_ISSUER_ID:-[EMPTY]}"
          if [ -n "$APP_STORE_PRIVATE_KEY" ]; then
            echo "APP_STORE_PRIVATE_KEY: [Present, length=${#APP_STORE_PRIVATE_KEY} chars]"
          else
            echo "APP_STORE_PRIVATE_KEY: [EMPTY]"
          fi
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] || [ -n "$CM_CERTIFICATE" ]; then
            echo "DISTRIBUTION_P12_SECRET: [Present]"
          else
            echo "DISTRIBUTION_P12_SECRET: [Not Set - will check keychain or available Apple certificate slot]"
          fi

          copy_gym_logs() {
            mkdir -p "$CM_BUILD_DIR/build/logs" 2>/dev/null || mkdir -p build/logs || true
            if [ -d "$HOME/Library/Logs/gym" ]; then
              cp -f "$HOME/Library/Logs/gym/"*.log "$CM_BUILD_DIR/build/logs/" 2>/dev/null || true
            fi
          }
          trap copy_gym_logs EXIT

          cd ios/App
          fastlane build_signed_ipa 2>&1 | tee ../../build/logs/fastlane-build-signed-ipa.log

      - name: Patch IPA (iPhone Only & Clean App Icons)
        script: |
          if [ -f build/resolved_build_number.txt ]; then
            CALCULATED_BUILD="$(cat build/resolved_build_number.txt | tr -d '[:space:]')"
          else
            RUN_NUM="${BUILD_NUMBER:-1}"
            if [ "$RUN_NUM" -le 252 ] 2>/dev/null; then
              CALCULATED_BUILD=$(( RUN_NUM + 252 ))
            else
              CALCULATED_BUILD=$RUN_NUM
            fi
          fi
          echo "Setting CFBundleVersion to: $CALCULATED_BUILD"
          KEYCHAIN_PATH="$HOME/Library/Keychains/ci_fastlane_keychain-db"
          if [ ! -f "$KEYCHAIN_PATH" ]; then
            KEYCHAIN_PATH="$HOME/Library/Keychains/ci_fastlane_keychain"
          fi
          python3 scripts/patch-ipa.py build/SnakePro.ipa "$KEYCHAIN_PATH" "$CALCULATED_BUILD"

      - name: Upload Patched IPA to TestFlight
        script: |
          cd ios/App
          fastlane upload_ipa

    artifacts:
      - build/SnakePro.ipa
      - build/logs/**/*.log
      - build/logs/**/*.txt
      - $HOME/Library/Logs/gym/*.log
